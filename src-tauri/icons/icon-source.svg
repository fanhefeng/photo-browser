<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="104" x2="0" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F1E2"/>
      <stop offset="1" stop-color="#EFE3CB"/>
    </linearGradient>
    <linearGradient id="skyC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AD1F5"/>
      <stop offset="1" stop-color="#D9EDFB"/>
    </linearGradient>
    <clipPath id="bodyC"><rect x="104" y="104" width="816" height="816" rx="182"/></clipPath>
    <filter id="bodyShadowC" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#4a3c22" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g filter="url(#bodyShadowC)">
    <rect x="104" y="104" width="816" height="816" rx="182" fill="url(#bgC)"/>
  </g>

  <!-- 奶油贴纸：双相纸 -->
  <g clip-path="url(#bodyC)">
    <g transform="translate(104 104) scale(0.796875)">
      <!-- 后一张 -->
      <g transform="rotate(-8 420 560)">
        <rect x="208" y="296" width="472" height="472" rx="28" fill="#E4D6B9" stroke="#2E2620" stroke-width="14"/>
      </g>
      <!-- 前一张（带阴影） -->
      <g transform="rotate(6 560 500)">
        <rect x="318" y="272" width="472" height="472" rx="28" transform="translate(14 18)" fill="#D9C8A6"/>
        <rect x="304" y="254" width="472" height="472" rx="28" fill="#FFF8EB" stroke="#2E2620" stroke-width="16"/>
        <rect x="342" y="292" width="396" height="316" rx="14" fill="url(#skyC)" stroke="#2E2620" stroke-width="12"/>
        <circle cx="452" cy="392" r="42" fill="#FFD666" stroke="#2E2620" stroke-width="12"/>
        <path d="M 348 602 L 474 466 L 556 550 L 642 452 L 732 558 L 732 602 Z" fill="#4E8AC9" stroke="#2E2620" stroke-width="12" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
