# Vite+ 接线（见 node_modules/vite-plus/README.md "Manual Installation & Migration"）：
# - 全项目把 vite 解析到 Vite+ 的 core 发行版（vp 各命令与插件共享同一份 vite）
# - vitest 固定为 vp 内置版本，避免出现两份 Vitest 内部状态分裂
overrides:
  esbuild@<0.28.1: 0.28.1
  vite@*: "catalog:"

# pnpm 11 默认拦截依赖的构建脚本，未放行即硬错误（ERR_PNPM_IGNORED_BUILDS）。
# 注意：pnpm 11 的设置键是 allowBuilds（旧的 onlyBuiltDependencies 已移除、静默无效）。
# esbuild 的安装脚本只是落平台二进制，放行。
allowBuilds:
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@oxfmt/binding-android-arm-eabi@0.76.0"
  - "@oxfmt/binding-android-arm64@0.76.0"
  - "@oxfmt/binding-darwin-arm64@0.76.0"
  - "@oxfmt/binding-darwin-x64@0.76.0"
