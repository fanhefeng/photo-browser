# Vite+ 接线（见 node_modules/vite-plus/README.md "Manual Installation & Migration"）：
# - 全项目把 vite 解析到 Vite+ 的 core 发行版（vp 各命令与插件共享同一份 vite）
# - vitest 固定为 vp 内置版本，避免出现两份 Vitest 内部状态分裂
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.10

# pnpm 10+ 默认拦截依赖的构建脚本；CI 环境下拦截会升级为硬错误
# （ERR_PNPM_IGNORED_BUILDS）。esbuild 的安装脚本只是落平台二进制，显式放行。
onlyBuiltDependencies:
  - esbuild
