name: Deploy site to GitHub Pages

on:
  # 纯官网改动（文案、样式、图片）直接部署——此时版本号没动，不存在超前展示的问题。
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  # 发版时由 Release 在 dmg 构建并发布成功后调用（见 release.yml 的 deploy-site job）。
  # 官网因此永远不会先亮出一个 releases/latest 还下载不到的版本号。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，进行中的不打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 官网下载按钮指向 releases/latest，所以版本号取自「最新已发布的 Release」而不是
      # package.json——只有真的有 dmg 可下载的版本才配显示在官网上。
      - name: Inject version into site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(gh release view --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$VER" ]; then
            VER=$(jq -r .version package.json)
            echo "取不到 Release，回退用 package.json 的版本号"
          fi
          sed -i "s#<span class=\"ver\">v[0-9][0-9.]*</span>#<span class=\"ver\">v${VER}</span>#g" site/index.html
          echo "Injected version v${VER}"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
