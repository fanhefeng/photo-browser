name: Release

# 发版 = 改版本号，没有别的手动步骤。
#   pnpm bump 0.4.2 && git commit -am "chore: bump 0.4.2" && git push
# 本工作流发现 package.json 的 version 还没有对应的 tag，就自动打 tag、构建、
# 发布 Release。构建成功后由「Deploy site to GitHub Pages」接力更新官网——
# 官网因此永远不会显示一个还下载不到 dmg 的版本号。
on:
  push:
    branches: [main]
    paths:
      - "package.json" # 版本号的单一数据源
      - ".github/workflows/release.yml"
  workflow_dispatch: # 手动补发（例如构建挂了修复后重跑）

permissions:
  contents: write # tauri-action 创建 tag/Release、上传 .dmg 需要写权限

jobs:
  # 版本号没变就不该重复发版，所以先查一遍 tag 是否已存在。
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 tag 列表才能判断该版本发过没有

      - name: Check version
        id: check
        run: |
          set -euo pipefail
          VER=$(jq -r .version package.json)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          # 四处版本号必须一致，否则 Release tag 会和产物文件名对不上。
          # 正常用 `pnpm bump` 改就不会出现这种情况，这里只做兜底拦截。
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$VER" != "$TAURI" ] || [ "$VER" != "$CARGO" ]; then
            echo "::error::版本号不一致（package.json=$VER tauri.conf.json=$TAURI Cargo.toml=$CARGO），请用 pnpm bump <版本> 同步"
            exit 1
          fi

          if git rev-parse "v$VER" >/dev/null 2>&1; then
            echo "tag v$VER 已存在，本次只是普通提交，跳过发版"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "准备发布 v$VER"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11 # 与本地一致；pnpm-workspace.yaml 的 overrides 需要 pnpm 10+ 才认

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # vite-plus engines 下限是 20.19，留出余量
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 仅 Apple Silicon（M 系列）
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 下载零依赖的静态 ffmpeg/ffprobe（arm64），作为 sidecar 打进 App，
      # 终端用户无需自行安装。命名须带 target triple 后缀供 Tauri externalBin 识别。
      # 版本与 SHA-256 固定死（原来跟 latest 重定向走，换包/被篡改都无从察觉）。
      # 升级：把 FFMPEG_BUILD 换成新构建号（latest 重定向的落点），两个哈希
      # 同步换成构建目录下官方 .sha256 文件里的值。
      - name: Fetch static ffmpeg/ffprobe (arm64) for sidecar bundling
        env:
          FFMPEG_BUILD: 1785863997_9.0 # ffmpeg 9.0
          FFMPEG_SHA256: 5267ef149ee0d208057a1b316aac079b661b0476574dee5da7d225769773c603
          FFPROBE_SHA256: 7778fbb533fb60d3336cbd9a9e51eced71658f020b570c7203590c1c41d42f50
        run: |
          set -euo pipefail
          BASE="https://ffmpeg.martin-riedl.de/download/macos/arm64/${FFMPEG_BUILD}"
          mkdir -p src-tauri/binaries
          curl -fL --retry 3 -o /tmp/ffmpeg.zip "${BASE}/ffmpeg.zip"
          curl -fL --retry 3 -o /tmp/ffprobe.zip "${BASE}/ffprobe.zip"
          echo "${FFMPEG_SHA256}  /tmp/ffmpeg.zip" | shasum -a 256 -c -
          echo "${FFPROBE_SHA256}  /tmp/ffprobe.zip" | shasum -a 256 -c -
          unzip -oj /tmp/ffmpeg.zip -d src-tauri/binaries
          unzip -oj /tmp/ffprobe.zip -d src-tauri/binaries
          mv src-tauri/binaries/ffmpeg src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          mv src-tauri/binaries/ffprobe src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin

      # tauri-action 会自动跑 beforeBuildCommand(pnpm build)+ tauri build，
      # 然后用 tag 创建 Release 并上传生成的 .dmg / .app.tar.gz。
      # 版本号取自 src-tauri/tauri.conf.json，产物名形如 photo-browser_0.1.0_universal.dmg。
      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.VERSION }} # tag 由 tauri-action 按当前 commit 创建
          releaseName: 照片浏览器 v${{ env.VERSION }}
          releaseBody: |
            ## 安装（macOS）

            1. 下载下方的 `.dmg`，打开后将「照片浏览器」拖入「应用程序」。
            2. 本应用**未经 Apple 签名公证**，首次打开会被 Gatekeeper 拦截，提示**「已损坏，无法打开」——App 本身并没有损坏**。此时「仍要打开」常常不出现、右键 →「打开」也无效（macOS 15 起 Apple 已移除该旁路），唯一可靠的解法是在「终端」执行下面一条命令清除下载隔离属性（无需重新下载，也不要把 App 丢进废纸篓）：

               ```
               xattr -dr com.apple.quarantine /Applications/photo-browser.app
               ```

            3. 视频封面与元数据所需的 `ffmpeg`/`ffprobe` 已内置在 App 内，无需另行安装。

            系统要求：Apple Silicon（M 系列）Mac，macOS 11 Big Sur 及以上。
          releaseDraft: false
          prerelease: false
          # 仅 Apple Silicon（M 系列）；ffmpeg/ffprobe 作为 sidecar 内置
          args: --target aarch64-apple-darwin

      # 注（v0.4.2 之后移除）：这里曾把「修复「已损坏」.command」脚本后处理注入 dmg
      # 根目录（UDZO 转 UDRW → 扩容 → 挂载 → 拷入 → 压回 → --clobber 重传，仅 v0.4.2
      # 附带过）。删掉的原因：脚本自身带着与 app 相同的 quarantine 隔离标记，双击会被
      # Gatekeeper 直接 SIGKILL（终端只显示一句 `zsh: killed`）；而 macOS 15 起 Apple
      # 移除了「右键 → 打开」旁路，放行脚本只剩「系统设置 → 隐私与安全性」一条路——
      # 和直接放行 app 本身是完全相同的步骤。它一步也没省，反而让用户以为修复跑过了、
      # 转头又看到「已损坏」。在完成 Developer ID 签名 + 公证之前，
      # `xattr -dr com.apple.quarantine` 是唯一文档化的解法（见 README 与官网安装说明），
      # 不要把这个脚本加回来。

  # app 构建成功后才更新官网——复用 deploy-pages.yml 那套部署逻辑，不重复实现。
  # release 被跳过（版本号没变）时这个 job 也跟着跳过，官网不会被无谓地重新部署。
  deploy-site:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
