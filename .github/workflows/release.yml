name: Release

# 发版 = 改版本号，没有别的手动步骤。
#   pnpm bump 0.4.2 && git commit -am "chore: bump 0.4.2" && git push
# 本工作流发现 package.json 的 version 还没有对应的 tag，就自动打 tag、构建、
# 发布 Release。构建成功后由「Deploy site to GitHub Pages」接力更新官网——
# 官网因此永远不会显示一个还下载不到 dmg 的版本号。
on:
  push:
    branches: [main]
    paths:
      - "package.json" # 版本号的单一数据源
      - ".github/workflows/release.yml"
  workflow_dispatch: # 手动补发（例如构建挂了修复后重跑）

permissions:
  contents: write # tauri-action 创建 tag/Release、上传 .dmg 需要写权限

jobs:
  # 版本号没变就不该重复发版，所以先查一遍 tag 是否已存在。
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 tag 列表才能判断该版本发过没有

      - name: Check version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: check
        run: |
          set -euo pipefail
          VER=$(jq -r .version package.json)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          # 四处版本号必须一致，否则 Release tag 会和产物文件名对不上。
          # 正常用 `pnpm bump` 改就不会出现这种情况，这里只做兜底拦截。
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$VER" != "$TAURI" ] || [ "$VER" != "$CARGO" ]; then
            echo "::error::版本号不一致（package.json=$VER tauri.conf.json=$TAURI Cargo.toml=$CARGO），请用 pnpm bump <版本> 同步"
            exit 1
          fi

          if git rev-parse "v$VER" >/dev/null 2>&1 && [ "$(gh release view "v$VER" --json isDraft --jq .isDraft 2>/dev/null || echo missing)" = "false" ]; then
            echo "tag v$VER 已存在，本次只是普通提交，跳过发版"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            bash scripts/verify-release-tag.sh "v$VER" "$GITHUB_SHA"
            echo "准备发布 v$VER"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11 # 与本地一致；pnpm-workspace.yaml 的 overrides 需要 pnpm 10+ 才认

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # vite-plus engines 下限是 20.19，留出余量
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 仅 Apple Silicon（M 系列）
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Build exact corresponding sources instead of redistributing an opaque static binary.
      - name: Build FFmpeg and ffprobe from pinned sources
        run: bash scripts/build-ffmpeg-source.sh

      - name: Verify video metadata and thumbnails
        run: python3 scripts/check-ffmpeg-sidecars.py .ffmpeg-build/output/bin

      - name: Stage verified sidecars
        run: |
          mkdir -p src-tauri/binaries
          cp .ffmpeg-build/sidecars/* src-tauri/binaries/

      # GitHub draft releases do not create their tag until publication.
      # Materialize the exact build tag first so the final source/tag gate can verify it.
      - name: Pin release tag to build commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/v${VERSION}" -f "sha=${GITHUB_SHA}"
          fi
          git fetch --no-tags origin "+refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          bash scripts/verify-release-tag.sh "v${VERSION}" "$GITHUB_SHA" required
          if [ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)" = true ]; then
            gh release edit "v${VERSION}" --target "$GITHUB_SHA"
          fi

      # tauri-action 会自动跑 beforeBuildCommand(pnpm build)+ tauri build，
      # 然后用 tag 创建 Release 并上传生成的 .dmg / .app.tar.gz。
      # 版本号取自 src-tauri/tauri.conf.json，产物名形如 photo-browser_0.1.0_universal.dmg。
      # TAURI_SIGNING_PRIVATE_KEY 是应用内更新（tauri-plugin-updater）的 minisign 私钥：
      # 签出 .app.tar.gz.sig 供旧版验签，tauri-action 检测到 updater 产物后还会生成
      # latest.json 一并上传（endpoint 指向 releases/latest/download/latest.json）。
      # 密钥本体在维护者本机 ~/.tauri/photo-browser-updater.key（无密码），丢了就只能
      # 换公钥重发一版——已装旧版将无法自动更新，务必保管好。
      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ env.VERSION }} # tag 由 tauri-action 按当前 commit 创建
          releaseName: 照片浏览器 v${{ env.VERSION }}
          releaseBody: |
            ## 安装（macOS）

            1. 下载下方的 `.dmg`，打开后将「照片浏览器」拖入「应用程序」。
            2. 本应用**尚未完成 Apple Developer ID 签名与公证**，首次打开可能被系统拦截或提示“已损坏”。请确认来自本仓库 Release，并核对下载完整性；该提示不能单独证明文件安全或未损坏。若系统提供“隐私与安全性 → 仍要打开”，可确认来源后按系统提示操作。
            3. 仍无法打开时，请先阅读 [安装说明与风险提示](https://github.com/fanhefeng/photo-browser#安装macos)，不要对未知来源的软件移除隔离标记。
            4. 视频元数据和封面所需的 ffmpeg/ffprobe 已内置，无需另行安装。

            **已装 v0.4.4 及以上版本？** 可通过应用菜单检查更新。更新包经过 minisign 验签，但这不等同于 Apple 公证，也不保证所有系统都不再出现安全提示。

            **FFmpeg/ffprobe 对应源码**：同一 Release 的 `photo-browser-ffmpeg-sources.tar.gz` 包含完整对应源码、构建脚本及许可。新构建采用 LGPL-2.1-or-later FFmpeg + BSD-2-Clause dav1d。

            系统要求：Apple Silicon（M 系列）Mac，macOS 11 Big Sur 及以上。
          releaseDraft: true
          prerelease: false
          # 仅 Apple Silicon（M 系列）；ffmpeg/ffprobe 作为 sidecar 内置
          args: --target aarch64-apple-darwin

      - name: Attach corresponding sources before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Re-read the remote tag after tauri-action created/resumed the draft.
          git fetch --no-tags origin "+refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          bash scripts/verify-release-tag.sh "v${VERSION}" "$GITHUB_SHA" required
          gh release upload "v${VERSION}" .ffmpeg-build/photo-browser-ffmpeg-sources.tar.gz --clobber
          gh release edit "v${VERSION}" --draft=false

      # 注（v0.4.2 之后移除）：这里曾把「修复「已损坏」.command」脚本后处理注入 dmg
      # 根目录（UDZO 转 UDRW → 扩容 → 挂载 → 拷入 → 压回 → --clobber 重传，仅 v0.4.2
      # 附带过）。删掉的原因：脚本自身带着与 app 相同的 quarantine 隔离标记，双击会被
      # Gatekeeper 直接 SIGKILL（终端只显示一句 `zsh: killed`）；而 macOS 15 起 Apple
      # 移除了「右键 → 打开」旁路，放行脚本只剩「系统设置 → 隐私与安全性」一条路——
      # 和直接放行 app 本身是完全相同的步骤。它一步也没省，反而让用户以为修复跑过了、
      # 转头又看到「已损坏」。在完成 Developer ID 签名 + 公证之前，
      # 隔离属性的手动处理仅作为确认来源后的风险自担选项（见 README），
      # 不要把这个脚本加回来。

  # app 构建成功后才更新官网——复用 deploy-pages.yml 那套部署逻辑，不重复实现。
  # release 被跳过（版本号没变）时这个 job 也跟着跳过，官网不会被无谓地重新部署。
  deploy-site:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
